blueprint:
  name: HVAC Calibrator
  description: Calibrate your HVAC using an external sensor and a numeric input entity to store 2 offsets (for heating/cooling). 
  domain: automation
  input:
    hvac:
      name: HVAC Climate Entity
      selector:
        entity:
          domain: climate
    temperature_sensor:
      name: Temperature Sensor
      description: Sensor used to calibrate your HVAC
      selector:
        entity:
          domain: sensor
          device_class: temperature
    hvac_calibration_number:
      name: TRV Calibration Entity
      description: If you can't find it it's possible that your HVAC don't support calibration. Consider using the Better Thermostat custom integration instead.
      selector:
        entity:
          domain: number
          device_class: temperature
    delay_in_minutes:
      name: Delay in minutes
      description: Your thermostat will take some time to update the current temperature after calibration. The delay should be higher than this time.
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1

mode: restart

variables:
  hvac: !input hvac
  hvac_calibration_number: !input hvac_calibration_number
  temperature_sensor: !input temperature_sensor                                

trigger:
  - platform: state
    entity_id: !input hvac
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - platform: state
    entity_id: !input hvac_calibration_number
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - platform: state
    entity_id: !input temperature_sensor
    for:
      hours: 0
      minutes: 0
      seconds: 0

condition:
  - condition: template
    value_template: '{{ state_attr(hvac, "current_temperature") != None }}'
  - condition: template
    value_template: '{{ states(hvac_calibration_number) != "unavailable" and states(hvac_calibration_number) != "unknown" }}'
  - condition: template
    value_template: '{{ states(temperature_sensor) != "unavailable" and states(temperature_sensor) != "unknown" }}'

action:
  - delay:
      hours: 0
      minutes: !input delay_in_minutes
      seconds: 0
      milliseconds: 0
  - service: number.set_value
    target:
      entity_id: !input hvac_calibration_number
    data:
      value: >- 
            {% set room_temperature = states(temperature_sensor) | float %}
            {% set hvac_temperature = state_attr(hvac, "current_temperature") | float(0) %}

            {% set hvac_calibration = states(hvac_calibration_number) | float %}
            {% set hvac_calibration_min = state_attr(hvac_calibration_number, "min") | float(-5) %}
            {% set hvac_calibration_max = state_attr(hvac_calibration_number, "max") | float(5) %}
            {% set hvac_calibration_step = state_attr(hvac_calibration_number, "step") | float(1) %}

            {% set step = hvac_calibration_step | string %}
            
            {% if step.split(".") | length > 1 -%}
              {% set hvac_calibration_step_decimals = step.split(".")[1] | length %}
            {%- else -%}
              {% set hvac_calibration_step_decimals = 0 %}
            {%- endif %}

            
            {% set new_hvac_calibration = room_temperature - hvac_temperature + hvac_calibration %}
            {% set new_hvac_calibration_bounded = [ [ (new_hvac_calibration - new_hvac_calibration % hvac_calibration_step) | round(hvac_calibration_step_decimals), hvac_calibration_min ] | max, hvac_calibration_max ] | min %}

            {% if new_hvac_calibration_bounded < hvac_calibration - hvac_calibration_step or hvac_calibration + hvac_calibration_step < new_hvac_calibration_bounded -%}
              {{ new_hvac_calibration_bounded }}
            {%- else -%}
              {{ states(hvac_calibration_number) }}
            {%- endif %}
